[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upsc-answer-evaluation"
version = "0.1.0"
description = "Autonomous UPSC Mains Answer Evaluation & Feedback Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "openai>=1.30.0",
    "pypdf>=4.2.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.7.0",
    "fonttools>=4.50.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyrefly]
search-path = ["."]
preset = "basic"
